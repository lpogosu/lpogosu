# Раскладка профиля. Правится здесь, а не в README: README между маркерами
# перезаписывается генератором целиком.
#
# Порядок разделов в файле — порядок разделов на странице. Репозиторий попадает
# в первый раздел, чьи topics с ним пересекаются, поэтому порядок ещё и решает
# неоднозначность: k8s-model-operator помечен и kubernetes, и llm, и должен
# оказаться среди LLM, а не среди платформы.

sections:
  - title: Платформа
    topics: [kubernetes, gitops, terraform, ansible, observability, devsecops, infrastructure-as-code]
  - title: CI/CD
    topics: [ci-cd, github-actions, gitlab-ci, jenkins, reusable-workflows]
  - title: LLM и данные
    topics: [llm, mlops, rag, embeddings, knowledge-graph, nlp, operator]
  - title: Эксплуатация
    topics: [sre, troubleshooting, dba, database, developer-tools, dotfiles]
  - title: Продукты и проектирование
    topics: [architecture, system-design, frontend]

# Явное назначение для случаев, где метки честно неоднозначны. Широкие темы вроде
# kubernetes есть у половины проектов, и «первый подходящий раздел» уводит их не
# туда: оператор для выката моделей — про LLM, а не про платформу, хотя помечен и
# тем, и другим. Здесь решает человек, а не порядок строк.
assign:
  k8s-model-operator: LLM и данные
  k8s-troubleshoot-agent: Эксплуатация
  pipeline-doctor: CI/CD
  dev-env: Эксплуатация
  genesis-provider: Продукты и проектирование
  insurance-sim: Продукты и проектирование

# Раздел для всего, что не подошло ни под один набор topics. Существует нарочно:
# новый репозиторий должен появиться в профиле сам, пусть и не в идеальном месте,
# а не исчезнуть молча из-за забытой метки.
fallback: Прочее

# Репозитории, которые никогда не показываются, даже став публичными.
exclude:
  - lpogosu

# Описание берётся из поля description самого репозитория — там ему и место,
# оно видно в карточке на GitHub. Здесь только случаи, где для витрины нужна
# формулировка острее той, что уместна в карточке.
overrides:
  service-classifier: >-
    Гибридный пайплайн, где LLM — только один этап из четырёх.
    GBM обошёл семь протестированных моделей
  pipeline-doctor: >-
    Разбор упавших пайплайнов: извлечение причины из мегабайтного лога,
    кластеризация, доказанная флакость и стоимость в машинном времени
