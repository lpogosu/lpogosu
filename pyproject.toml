[project]
name = "profile-render"
version = "1.0.0"
description = "Генератор блока со списком репозиториев для README профиля"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 ищут кириллицу, похожую на латиницу — защита от гомоглифных подмен
# в латинском коде. Здесь комментарии и сообщения намеренно русские, так что
# правило срабатывает на каждой строке текста и прячет за собой настоящие находки.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Тест дописывает scripts/ в sys.path до импорта проверяемого модуля.
"tests/test_render_profile.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
